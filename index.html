<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="description" content="OmniSearch - 聚合搜索，一框搜遍全网">
<title>OmniSearch 聚合搜索</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f5f6fa;
  --card: #ffffff;
  --text: #1a1d29;
  --text-dim: #6b7080;
  --accent: #4a6cf7;
  --accent-soft: #eaefff;
  --border: #e4e7ef;
  --shadow: 0 4px 24px rgba(20, 30, 80, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1220;
    --card: #1a1f33;
    --text: #eef0f8;
    --text-dim: #8a90a5;
    --accent: #6d8bff;
    --accent-soft: #232c4d;
    --border: #2a3050;
    --shadow: 0 4px 24px rgba(0, 0, 0, .35);
  }
}
[data-theme="dark"] {
  --bg: #0f1220; --card: #1a1f33; --text: #eef0f8; --text-dim: #8a90a5;
  --accent: #6d8bff; --accent-soft: #232c4d; --border: #2a3050;
  --shadow: 0 4px 24px rgba(0,0,0,.35);
}
[data-theme="light"] {
  --bg: #f5f6fa; --card: #ffffff; --text: #1a1d29; --text-dim: #6b7080;
  --accent: #4a6cf7; --accent-soft: #eaefff; --border: #e4e7ef;
  --shadow: 0 4px 24px rgba(20,30,80,.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  transition: background .3s;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.container { width: 100%; max-width: 680px; padding: 0 20px; display: flex; flex-direction: column; align-items: center; }
/* header */
.topbar { width: 100%; max-width: 680px; display: flex; justify-content: flex-end; padding: 14px 20px 0; gap: 8px; }
.icon-btn {
  background: var(--card); border: 1px solid var(--border); color: var(--text-dim);
  width: 38px; height: 38px; border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 17px;
  transition: transform .15s;
}
.icon-btn:active { transform: scale(.92); }
/* logo */
.logo { margin-top: clamp(30px, 12vh, 110px); font-size: clamp(30px, 6vw, 42px); font-weight: 800; letter-spacing: -1px; user-select: none; }
.logo span { color: var(--accent); }
.slogan { color: var(--text-dim); font-size: 13px; margin-top: 6px; margin-bottom: 26px; }
/* engine tabs */
.engines { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; width: 100%; }
.engine-tab {
  padding: 7px 15px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--card); color: var(--text-dim); font-size: 13.5px; cursor: pointer;
  transition: all .18s; white-space: nowrap; user-select: none;
}
.engine-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.engine-tab:not(.active):hover { border-color: var(--accent); color: var(--accent); }
/* search box */
.search-wrap { width: 100%; position: relative; }
.search-box {
  display: flex; align-items: center; width: 100%;
  background: var(--card); border: 2px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow); transition: border-color .2s; overflow: hidden;
}
.search-box:focus-within { border-color: var(--accent); }
.search-box input {
  flex: 1; border: none; outline: none; background: transparent; color: var(--text);
  font-size: 16.5px; padding: 15px 6px 15px 18px; min-width: 0;
}
.search-box input::placeholder { color: var(--text-dim); }
.clear-btn {
  border: none; background: none; color: var(--text-dim); font-size: 17px;
  padding: 8px; cursor: pointer; display: none;
}
.search-btn {
  border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
  padding: 0 22px; align-self: stretch; cursor: pointer; transition: filter .15s;
}
.search-btn:active { filter: brightness(.88); }
/* suggestions dropdown */
.suggest {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 30;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); overflow: hidden; display: none;
}
.suggest.open { display: block; }
.suggest-item {
  padding: 12px 18px; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.suggest-item:last-child { border-bottom: none; }
.suggest-item:hover, .suggest-item.hl { background: var(--accent-soft); }
.suggest-item .tag { color: var(--text-dim); font-size: 12px; margin-left: auto; }
/* multi search */
.multi-row { margin-top: 16px; display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13.5px; user-select: none; }
.multi-row input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
.multi-row label { cursor: pointer; }
/* history */
.history { width: 100%; margin-top: 26px; }
.history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.history-head h3 { font-size: 13.5px; color: var(--text-dim); font-weight: 600; }
.history-head button { border: none; background: none; color: var(--text-dim); font-size: 12.5px; cursor: pointer; }
.history-head button:hover { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--card); border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 14px; font-size: 13.5px; color: var(--text); cursor: pointer;
  transition: all .15s; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
/* camera button */
.cam-btn {
  border: none; background: none; color: var(--text-dim); font-size: 20px;
  padding: 8px 4px; cursor: pointer; transition: color .15s;
}
.cam-btn:hover { color: var(--accent); }
/* image search modal */
.modal-mask {
  position: fixed; inset: 0; background: rgba(10, 12, 25, .55); z-index: 100;
  display: none; align-items: flex-end; justify-content: center;
}
.modal-mask.open { display: flex; }
@media (min-width: 600px) { .modal-mask.open { align-items: center; } }
.modal {
  background: var(--card); border-radius: 22px 22px 0 0; width: 100%; max-width: 460px;
  padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow);
}
@media (min-width: 600px) { .modal { border-radius: 22px; padding-bottom: 22px; } }
.modal h3 { font-size: 17px; margin-bottom: 4px; }
.modal .sub { color: var(--text-dim); font-size: 12.5px; margin-bottom: 16px; }
.modal-close {
  float: right; border: none; background: var(--bg); color: var(--text-dim);
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px;
}
.pick-row { display: flex; gap: 12px; }
.pick-btn {
  flex: 1; padding: 22px 10px; border-radius: 16px; border: 1.5px dashed var(--border);
  background: var(--bg); color: var(--text); font-size: 14.5px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 8px; transition: border-color .15s;
}
.pick-btn:hover { border-color: var(--accent); }
.pick-btn .big { font-size: 30px; }
.preview-wrap { display: none; text-align: center; }
.preview-wrap img {
  max-width: 100%; max-height: 38vh; border-radius: 14px; border: 1px solid var(--border);
  object-fit: contain; margin-bottom: 14px;
}
.engine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.eng-btn {
  padding: 13px 8px; border-radius: 13px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all .15s;
}
.eng-btn:hover { border-color: var(--accent); color: var(--accent); }
.eng-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.eng-btn small { display: block; font-weight: 400; font-size: 11px; color: inherit; opacity: .75; margin-top: 3px; }
.retake { margin-top: 12px; border: none; background: none; color: var(--text-dim); font-size: 13px; cursor: pointer; text-decoration: underline; }
/* AI ask panel */
.ask-btn-row { margin-bottom: 10px; }
.ask-open-btn {
  width: 100%; padding: 13px; border-radius: 13px; border: none; cursor: pointer;
  background: linear-gradient(135deg, #4a6cf7, #7b4af7); color: #fff; font-size: 14.5px; font-weight: 700;
}
.ask-panel { display: none; text-align: left; }
.ask-panel.open { display: block; }
.ask-thumb { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ask-thumb img { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
.ask-thumb .t { font-size: 13px; color: var(--text-dim); }
.chat-log {
  max-height: 34vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 10px; padding: 2px;
}
.msg { max-width: 88%; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.err { align-self: flex-start; background: #fdecec; color: #c0392b; border: 1px solid #f5c6c6; font-size: 13px; }
[data-theme="dark"] .msg.err { background: #3a2020; border-color: #5c2e2e; color: #ff9a8a; }
.quick-qs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.quick-q {
  border: 1px solid var(--border); background: var(--bg); color: var(--text-dim);
  border-radius: 999px; padding: 5px 11px; font-size: 12px; cursor: pointer;
}
.quick-q:hover { color: var(--accent); border-color: var(--accent); }
.ask-input-row { display: flex; gap: 8px; }
.ask-input-row input {
  flex: 1; border: 1.5px solid var(--border); border-radius: 12px; padding: 11px 13px;
  font-size: 14.5px; background: var(--bg); color: var(--text); outline: none; min-width: 0;
}
.ask-input-row input:focus { border-color: var(--accent); }
.ask-send {
  border: none; background: var(--accent); color: #fff; border-radius: 12px;
  padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.ask-send:disabled { opacity: .5; cursor: default; }
.ask-foot { display: flex; justify-content: space-between; margin-top: 10px; }
.ask-foot button { border: none; background: none; color: var(--text-dim); font-size: 12.5px; cursor: pointer; text-decoration: underline; }
/* settings */
.settings-panel { display: none; }
.settings-panel.open { display: block; }
.settings-panel label { display: block; font-size: 12.5px; color: var(--text-dim); margin: 10px 0 4px; }
.settings-panel input, .settings-panel select {
  width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px;
  font-size: 14px; background: var(--bg); color: var(--text); outline: none;
}
.settings-panel input:focus { border-color: var(--accent); }
.settings-save { margin-top: 14px; width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-size: 14.5px; font-weight: 600; cursor: pointer; }
.hint { font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.6; }
.hint a { color: var(--accent); }
/* footer */
footer { margin-top: auto; padding: 26px 0 20px; color: var(--text-dim); font-size: 12px; text-align: center; }
kbd {
  background: var(--card); border: 1px solid var(--border); border-radius: 5px;
  padding: 1px 6px; font-size: 11px; font-family: inherit;
}
@media (max-width: 480px) {
  .engines { gap: 5px; }
  .engine-tab { padding: 6px 12px; font-size: 12.5px; }
  .logo { margin-top: 8vh; }
  kbd { display: none; }
}
</style>
</head>
<body>
<div class="topbar">
  <button class="icon-btn" id="themeBtn" title="切换主题">◐</button>
</div>

<div class="container">
  <h1 class="logo">Omni<span>Search</span></h1>
  <p class="slogan">一框搜遍全网 · 手机电脑都好用</p>

  <div class="engines" id="engines"></div>

  <div class="search-wrap">
    <form class="search-box" id="form">
      <input type="search" id="q" placeholder="输入关键词搜索…" autocomplete="off" autofocus enterkeyhint="search">
      <button type="button" class="clear-btn" id="clearBtn" title="清空">✕</button>
      <button type="button" class="cam-btn" id="camBtn" title="拍照识图搜同款">📷</button>
      <button type="submit" class="search-btn">搜索</button>
    </form>
    <div class="suggest" id="suggest"></div>
  </div>

  <div class="multi-row">
    <input type="checkbox" id="multi">
    <label for="multi">聚合模式：同时用多个引擎打开搜索结果</label>
  </div>

  <div class="history" id="historyWrap" style="display:none">
    <div class="history-head">
      <h3>搜索历史</h3>
      <button id="clearHistory">清空</button>
    </div>
    <div class="chips" id="historyChips"></div>
  </div>
</div>

<footer>
  <kbd>Tab</kbd> 切换引擎 · <kbd>Enter</kbd> 搜索 &nbsp;|&nbsp; 可"添加到主屏幕"离线使用
</footer>

<!-- 识图搜索弹窗 -->
<div class="modal-mask" id="imgMask">
  <div class="modal">
    <button class="modal-close" id="imgClose">✕</button>
    <h3>📷 拍照识图 · 搜同款</h3>
    <p class="sub">拍下物品（如眼镜、衣服、商品），用识图引擎找同款和品牌型号</p>

    <div class="pick-row" id="pickRow">
      <button class="pick-btn" id="btnCamera"><span class="big">📸</span>拍照</button>
      <button class="pick-btn" id="btnAlbum"><span class="big">🖼️</span>从相册选</button>
    </div>
    <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileAlbum" accept="image/*" hidden>

    <div class="preview-wrap" id="previewWrap">
      <img id="previewImg" alt="预览">
      <div class="ask-btn-row">
        <button class="ask-open-btn" id="askOpenBtn">💬 对这张图提问（AI 识别品牌型号）</button>
      </div>
      <div class="engine-grid">
        <button class="eng-btn primary" data-eng="google">Google 识图<small>找同款最强 · 需外网</small></button>
        <button class="eng-btn" data-eng="bing">必应识图<small>国内可用 · 可购物比价</small></button>
        <button class="eng-btn" data-eng="yandex">Yandex 识图<small>相似图召回好</small></button>
        <button class="eng-btn" data-eng="baidu">百度识图<small>打开后粘贴/选择图片</small></button>
      </div>
      <button class="retake" id="retakeBtn">重新选择图片</button>
    </div>

    <!-- AI 图片问答面板 -->
    <div class="ask-panel" id="askPanel">
      <div class="ask-thumb">
        <img id="askThumb" alt="">
        <div class="t">对这张图片提问，AI 会告诉你它看到了什么</div>
      </div>
      <div class="chat-log" id="chatLog"></div>
      <div class="quick-qs" id="quickQs">
        <button class="quick-q">这是什么品牌和型号？</button>
        <button class="quick-q">在香港哪里可以买到？大概多少钱？</button>
        <button class="quick-q">上面的文字/logo写了什么？</button>
        <button class="quick-q">有哪些相似的替代款？</button>
      </div>
      <div class="ask-input-row">
        <input type="text" id="askInput" placeholder="例如：这副眼镜是什么牌子？" enterkeyhint="send">
        <button class="ask-send" id="askSend">发送</button>
      </div>
      <div class="ask-foot">
        <button id="askBack">← 返回识图</button>
        <button id="askSettings">⚙️ AI 设置</button>
      </div>
    </div>

    <!-- AI 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
      <h3 style="font-size:15px;margin-bottom:2px">⚙️ AI 模型设置</h3>
      <p class="sub">已内置免费模型，开箱即用。也可换成你自己的 OpenAI 兼容接口（密钥只存本机）</p>
      <label>服务商预设</label>
      <select id="setPreset">
        <option value="zhipu">智谱 GLM（免费推荐）</option>
        <option value="qwen">阿里通义千问</option>
        <option value="moonshot">月之暗面 Kimi</option>
        <option value="openai">OpenAI</option>
        <option value="custom">自定义</option>
      </select>
      <label>API 地址</label>
      <input type="text" id="setUrl" placeholder="https://.../v1/chat/completions">
      <label>模型名</label>
      <input type="text" id="setModel" placeholder="qwen-vl-plus">
      <label>API Key</label>
      <input type="password" id="setKey" placeholder="sk-...">
      <button class="settings-save" id="setSave">保存</button>
      <p class="hint">获取免费/低价 Key：通义千问 → <a href="https://bailian.console.aliyun.com" target="_blank">阿里云百炼</a>（新用户有免费额度）；智谱 → <a href="https://open.bigmodel.cn" target="_blank">open.bigmodel.cn</a>（GLM-4V-Flash 免费）</p>
    </div>
  </div>
</div>

<script>
// ===== 搜索引擎配置 =====
const ENGINES = [
  { id: 'baidu',   name: '百度',       url: 'https://www.baidu.com/s?wd=%s' },
  { id: 'bing',    name: '必应',       url: 'https://www.bing.com/search?q=%s' },
  { id: 'google',  name: 'Google',    url: 'https://www.google.com/search?q=%s' },
  { id: 'ddg',     name: 'DuckDuckGo',url: 'https://duckduckgo.com/?q=%s' },
  { id: 'zhihu',   name: '知乎',       url: 'https://www.zhihu.com/search?type=content&q=%s' },
  { id: 'bili',    name: 'B站',       url: 'https://search.bilibili.com/all?keyword=%s' },
  { id: 'github',  name: 'GitHub',    url: 'https://github.com/search?q=%s' },
  { id: 'taobao',  name: '淘宝',       url: 'https://s.taobao.com/search?q=%s' },
];
const LS = { engine: 'os_engine', history: 'os_history', theme: 'os_theme', multi: 'os_multi' };

let currentEngine = localStorage.getItem(LS.engine) || 'baidu';
let history = JSON.parse(localStorage.getItem(LS.history) || '[]');
let hlIndex = -1;

const $ = id => document.getElementById(id);
const enginesEl = $('engines'), input = $('q'), suggestEl = $('suggest');

// ===== 引擎标签 =====
function renderEngines() {
  enginesEl.innerHTML = '';
  ENGINES.forEach(e => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'engine-tab' + (e.id === currentEngine ? ' active' : '');
    b.textContent = e.name;
    b.onclick = () => { currentEngine = e.id; localStorage.setItem(LS.engine, e.id); renderEngines(); input.focus(); };
    enginesEl.appendChild(b);
  });
}

// ===== 搜索 =====
function doSearch(kw) {
  kw = (kw ?? input.value).trim();
  if (!kw) return;
  saveHistory(kw);
  const enc = encodeURIComponent(kw);
  if ($('multi').checked) {
    // 聚合模式：打开多个引擎（浏览器可能拦截弹窗，需用户允许）
    ['baidu', 'bing', 'google'].forEach((id, i) => {
      const e = ENGINES.find(x => x.id === id);
      setTimeout(() => window.open(e.url.replace('%s', enc), '_blank'), i * 120);
    });
  } else {
    const e = ENGINES.find(x => x.id === currentEngine);
    window.open(e.url.replace('%s', enc), '_blank');
  }
  closeSuggest();
}

$('form').addEventListener('submit', ev => { ev.preventDefault(); doSearch(); });

// ===== 历史记录 =====
function saveHistory(kw) {
  history = [kw, ...history.filter(h => h !== kw)].slice(0, 12);
  localStorage.setItem(LS.history, JSON.stringify(history));
  renderHistory();
}
function renderHistory() {
  const wrap = $('historyWrap'), chips = $('historyChips');
  if (!history.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  chips.innerHTML = '';
  history.forEach(h => {
    const c = document.createElement('button');
    c.className = 'chip'; c.textContent = h; c.title = h;
    c.onclick = () => { input.value = h; doSearch(h); };
    chips.appendChild(c);
  });
}
$('clearHistory').onclick = () => { history = []; localStorage.removeItem(LS.history); renderHistory(); };

// ===== 搜索建议（百度 JSONP，失败时降级为历史匹配）=====
let suggestTimer;
input.addEventListener('input', () => {
  $('clearBtn').style.display = input.value ? 'block' : 'none';
  clearTimeout(suggestTimer);
  const kw = input.value.trim();
  if (!kw) { closeSuggest(); return; }
  suggestTimer = setTimeout(() => fetchSuggest(kw), 180);
});

function fetchSuggest(kw) {
  const cb = 'osSug_' + Date.now();
  const script = document.createElement('script');
  let done = false;
  window[cb] = data => {
    done = true;
    const list = (data && data.s) ? data.s.slice(0, 8) : [];
    showSuggest(list, kw);
    cleanup();
  };
  script.src = `https://suggestion.baidu.com/su?wd=${encodeURIComponent(kw)}&cb=${cb}`;
  script.onerror = () => { fallbackSuggest(kw); cleanup(); };
  document.body.appendChild(script);
  setTimeout(() => { if (!done) { fallbackSuggest(kw); cleanup(); } }, 1500);
  function cleanup() { delete window[cb]; script.remove(); }
}
function fallbackSuggest(kw) {
  showSuggest(history.filter(h => h.includes(kw)).slice(0, 6), kw, true);
}
function showSuggest(list, kw, isHistory) {
  if (!list.length || input.value.trim() !== kw) { closeSuggest(); return; }
  hlIndex = -1;
  suggestEl.innerHTML = '';
  list.forEach(s => {
    const d = document.createElement('div');
    d.className = 'suggest-item';
    d.innerHTML = `<span>🔍</span><span></span>` + (isHistory ? `<span class="tag">历史</span>` : '');
    d.children[1].textContent = s;
    d.onmousedown = ev => { ev.preventDefault(); input.value = s; doSearch(s); };
    suggestEl.appendChild(d);
  });
  suggestEl.classList.add('open');
}
function closeSuggest() { suggestEl.classList.remove('open'); hlIndex = -1; }
document.addEventListener('click', ev => { if (!ev.target.closest('.search-wrap')) closeSuggest(); });

// 键盘上下选择建议
input.addEventListener('keydown', ev => {
  const items = suggestEl.querySelectorAll('.suggest-item');
  if (!items.length) return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    hlIndex = ev.key === 'ArrowDown'
      ? (hlIndex + 1) % items.length
      : (hlIndex - 1 + items.length) % items.length;
    items.forEach((it, i) => it.classList.toggle('hl', i === hlIndex));
    input.value = items[hlIndex].children[1].textContent;
  } else if (ev.key === 'Escape') closeSuggest();
});

// Tab 切换引擎
document.addEventListener('keydown', ev => {
  if (ev.key === 'Tab' && document.activeElement === input) {
    ev.preventDefault();
    const idx = ENGINES.findIndex(e => e.id === currentEngine);
    currentEngine = ENGINES[(idx + (ev.shiftKey ? -1 : 1) + ENGINES.length) % ENGINES.length].id;
    localStorage.setItem(LS.engine, currentEngine);
    renderEngines();
  }
});

// 清空按钮
$('clearBtn').onclick = () => { input.value = ''; $('clearBtn').style.display = 'none'; closeSuggest(); input.focus(); };

// ===== 主题切换 =====
const themeBtn = $('themeBtn');
function applyTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme(localStorage.getItem(LS.theme));
themeBtn.onclick = () => {
  const cur = localStorage.getItem(LS.theme);
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem(LS.theme, next);
  applyTheme(next);
};

// 聚合模式记忆
$('multi').checked = localStorage.getItem(LS.multi) === '1';
$('multi').onchange = ev => localStorage.setItem(LS.multi, ev.target.checked ? '1' : '0');

// ===== AI 图片问答 =====
const PRESETS = {
  qwen:     { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-vl-plus' },
  zhipu:    { url: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',              model: 'glm-4v-flash' },
  moonshot: { url: 'https://api.moonshot.cn/v1/chat/completions',                        model: 'moonshot-v1-8k-vision-preview' },
  openai:   { url: 'https://api.openai.com/v1/chat/completions',                         model: 'gpt-4o-mini' },
  custom:   { url: '', model: '' },
};
const AI_LS = 'os_ai_cfg';
// 内置默认配置：智谱 GLM-4V-Flash（免费视觉模型），用户无需配置即可用；也可在设置里改成自己的
const DEFAULT_AI_CFG = { preset: 'zhipu', ...PRESETS.zhipu, key: '87df77cd38f542dab356ec5b52747021.BodLhiPloXl1R0Kg' };
let aiCfg = JSON.parse(localStorage.getItem(AI_LS) || 'null') || DEFAULT_AI_CFG;
let chatMsgs = []; // 多轮对话上下文

const askPanel = $('askPanel'), settingsPanel = $('settingsPanel'), chatLog = $('chatLog');

function showPanel(which) { // 'preview' | 'ask' | 'settings'
  $('previewWrap').style.display = which === 'preview' ? 'block' : 'none';
  askPanel.classList.toggle('open', which === 'ask');
  settingsPanel.classList.toggle('open', which === 'settings');
}

$('askOpenBtn').onclick = () => {
  $('askThumb').src = $('previewImg').src;
  showPanel('ask');
  $('askInput').focus();
};
$('askBack').onclick = () => showPanel('preview');
$('askSettings').onclick = openSettings;

function openSettings() {
  const c = aiCfg || DEFAULT_AI_CFG;
  $('setPreset').value = c.preset || 'custom';
  $('setUrl').value = c.url; $('setModel').value = c.model; $('setKey').value = c.key || '';
  showPanel('settings');
}
$('setPreset').onchange = ev => {
  const p = PRESETS[ev.target.value];
  if (p.url) { $('setUrl').value = p.url; $('setModel').value = p.model; }
};
$('setSave').onclick = () => {
  aiCfg = {
    preset: $('setPreset').value,
    url: $('setUrl').value.trim(),
    model: $('setModel').value.trim(),
    key: $('setKey').value.trim(),
  };
  if (!aiCfg.url || !aiCfg.model || !aiCfg.key) { alert('请填写完整：API地址、模型名、Key'); return; }
  localStorage.setItem(AI_LS, JSON.stringify(aiCfg));
  $('askThumb').src = $('previewImg').src;
  showPanel('ask');
};

// 快捷问题
document.querySelectorAll('.quick-q').forEach(b => {
  b.onclick = () => { $('askInput').value = b.textContent; sendAsk(); };
});
$('askSend').onclick = sendAsk;
$('askInput').addEventListener('keydown', ev => { if (ev.key === 'Enter') sendAsk(); });

function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chatLog.appendChild(d);
  chatLog.scrollTop = chatLog.scrollHeight;
  return d;
}

async function sendAsk() {
  const q = $('askInput').value.trim();
  if (!q || !pickedB64) return;
  $('askInput').value = '';
  $('askSend').disabled = true;
  addMsg('user', q);
  const aiDiv = addMsg('ai', '思考中…');

  // 构造消息：第一轮带图片，后续轮次带上下文
  const userContent = chatMsgs.length === 0
    ? [{ type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + pickedB64 } }, { type: 'text', text: q }]
    : [{ type: 'text', text: q }];
  chatMsgs.push({ role: 'user', content: userContent });

  try {
    const res = await fetch(aiCfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + aiCfg.key },
      body: JSON.stringify({
        model: aiCfg.model,
        messages: [
          { role: 'system', content: `你是一个专业的物品识别与购物顾问助手，用户会拍摄物品照片（常见为眼镜、服饰、数码产品等）并提问。请用中文回答，遵循：
1. 识别品牌与型号：仔细观察 logo、镜腿/标签上的文字、外形特征、材质、配色。能确定就直接给出；不能确定则给出2-3个最可能的候选品牌/型号并说明依据（如"镜腿的金属饰片是XX的标志性设计"）。
2. 用户问"在哪买"时：优先按用户所在城市回答（若未说明，默认香港）。香港购买眼镜的常见渠道包括：品牌专卖店（如Ray-Ban、Gentle Monster、Oliver Peoples 等在铜锣湾/尖沙咀/中环的门店）、连锁眼镜行（眼镜88、OPTICAL 88、溥仪眼镜 Puyi Optical、Hong Kong Optical、Owndays、JINS）、百货公司专柜（海港城、时代广场、IFC、K11 MUSEA）、以及线上（品牌官网、HKTVmall、Farfetch、Zalora、天猫国际）。请结合识别出的品牌档次推荐最匹配的渠道，并给出大致参考价位（港币）。
3. 无法看清时，主动告诉用户拍哪个部位（如镜腿内侧型号刻字、logo 特写）能提高识别率。
回答简洁有条理，用小标题或列表。` },
          ...chatMsgs,
        ],
        max_tokens: 1000,
      }),
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`HTTP ${res.status}: ${errText.slice(0, 200)}`);
    }
    const data = await res.json();
    const answer = data.choices?.[0]?.message?.content || '（模型未返回内容）';
    aiDiv.textContent = answer;
    chatMsgs.push({ role: 'assistant', content: answer });
  } catch (e) {
    chatMsgs.pop(); // 失败回滚，避免污染上下文
    aiDiv.className = 'msg err';
    aiDiv.textContent = '请求失败：' + e.message + '\n\n可能原因：Key错误 / 余额不足 / 该服务不允许浏览器直连(CORS)。可到 ⚙️AI设置 换一家服务商（推荐智谱GLM-4V-Flash，免费且支持浏览器直连）。';
  } finally {
    $('askSend').disabled = false;
    chatLog.scrollTop = chatLog.scrollHeight;
  }
}

// 换图/关弹窗时清空对话
function resetChat() { chatMsgs = []; chatLog.innerHTML = ''; }

// ===== 拍照识图搜同款 =====
const imgMask = $('imgMask');
let pickedFile = null, pickedB64 = null;

$('camBtn').onclick = () => { imgMask.classList.add('open'); };
$('imgClose').onclick = closeImgModal;
imgMask.addEventListener('click', ev => { if (ev.target === imgMask) closeImgModal(); });
function closeImgModal() {
  imgMask.classList.remove('open');
  resetPick();
}
function resetPick() {
  pickedFile = pickedB64 = null;
  $('pickRow').style.display = 'flex';
  $('previewWrap').style.display = 'none';
  askPanel.classList.remove('open');
  settingsPanel.classList.remove('open');
  $('fileCamera').value = $('fileAlbum').value = '';
  resetChat();
}
$('retakeBtn').onclick = resetPick;

$('btnCamera').onclick = () => $('fileCamera').click();
$('btnAlbum').onclick = () => $('fileAlbum').click();
$('fileCamera').onchange = ev => handleImage(ev.target.files[0]);
$('fileAlbum').onchange = ev => handleImage(ev.target.files[0]);

// 压缩到最长边 1000px 的 JPEG，避免上传超限、加快速度
function handleImage(file) {
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const MAX = 1000;
    let { width: w, height: h } = img;
    if (Math.max(w, h) > MAX) { const r = MAX / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    canvas.toBlob(blob => {
      pickedFile = new File([blob], 'photo.jpg', { type: 'image/jpeg' });
      pickedB64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
      $('previewImg').src = URL.createObjectURL(blob);
      $('pickRow').style.display = 'none';
      $('previewWrap').style.display = 'block';
    }, 'image/jpeg', 0.85);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
}

// 提交到识图引擎
document.querySelectorAll('.eng-btn').forEach(b => {
  b.onclick = () => visualSearch(b.dataset.eng);
});

function visualSearch(engine) {
  if (!pickedFile && engine !== 'baidu') return;
  if (engine === 'google') {
    // Google Lens：multipart 文件上传
    postFileForm('https://lens.google.com/v3/upload?hl=zh-CN', 'encoded_image', pickedFile);
  } else if (engine === 'yandex') {
    postFileForm('https://yandex.com/images/search?rpt=imageview', 'upfile', pickedFile);
  } else if (engine === 'bing') {
    // 必应识图：base64 表单
    const form = document.createElement('form');
    form.method = 'POST'; form.target = '_blank'; form.style.display = 'none';
    form.action = 'https://www.bing.com/images/search?view=detailv2&iss=sbiupload&FORM=SBIIRP&sbisrc=UrlPaste&idpbck=1';
    const inp = document.createElement('input');
    inp.type = 'hidden'; inp.name = 'imageBin'; inp.value = pickedB64;
    form.appendChild(inp);
    document.body.appendChild(form);
    form.submit();
    form.remove();
  } else if (engine === 'baidu') {
    // 百度识图不支持跨站直传，打开其页面后用户粘贴/上传（手机上可长按粘贴刚拍的图）
    window.open('https://graph.baidu.com/pcpage/index?tpl_from=pc', '_blank');
  }
}

// 通用：构造 multipart 文件表单提交（利用 DataTransfer 塞文件）
function postFileForm(action, fieldName, file) {
  const form = document.createElement('form');
  form.method = 'POST'; form.action = action; form.target = '_blank';
  form.enctype = 'multipart/form-data'; form.style.display = 'none';
  const inp = document.createElement('input');
  inp.type = 'file'; inp.name = fieldName;
  const dt = new DataTransfer();
  dt.items.add(file);
  inp.files = dt.files;
  form.appendChild(inp);
  document.body.appendChild(form);
  form.submit();
  form.remove();
}

renderEngines();
renderHistory();

// ===== PWA =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
